[project]
name = "py-terser"
description = "Fork of python-minifier: transform Python project into its most compact representation"
keywords = ["minify", "minifier", "uglify", "uglifier", "mangler", "compressor"]
authors = [{ name = "Alpha", email = "dev@alpha93.kr" }]
readme = "README.md"
license = "MIT"
dynamic = ["version"]
classifiers = [
    "Environment :: Console",
    "Environment :: Plugins",
    "Framework :: Hatch",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Pre-processors",
    "Topic :: Text Processing :: General",
    "Topic :: Utilities",

    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    #"Programming Language :: Python :: 3.15",  # TODO
    "Programming Language :: Python :: Free Threading",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: Implementation :: CPython",

    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",

    "Development Status :: 3 - Alpha",
]
requires-python = ">=3.13"
dependencies = [
    "alpha93>=1.2.5",
    "anyio>=4.14.2",
    "hatchling>=1.17",
]

[dependency-groups]
trio = [
    "trio>=0.33.0",
]
cli = [
    "pydantic>=2.13.4",
    "tqdm>=4.68.4",
]
hatchling = [
    "hatchling>=1.31.0",
]
dev = [
    "pytest>=8.4",
    "ruff>=0.15.22",
    "ty>=0.0.61",
]


[project.urls]
source = "https://github.com/MadeByAlpha/py-terser.git"
issues = "https://github.com/MadeByAlpha/py-terser/issues"

[project.scripts]
terser = "terser.cli:main"

[project.entry-points.hatch]
terser = "terser.hooks"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "../../pyproject.toml"
pattern = 'version = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/terser", "src/alpha93/progression"]

[tool.hatch.build.targets.force-include]
"src/alpha93/commons" = "alpha93/commons"


[tool.ruff]
src = ["src"]
target-version = "py314"    # INTENDED: due to type annotations
show-fixes = true

unsafe-fixes = true

[tool.ruff.analyze]
detect-string-imports = true

preview = true

[tool.ruff.lint]
future-annotations = true
ignore = [
    "E731",
]

[tool.ty.environment]
root = ["./src"]
python-version = "3.14"     # INTENDED: due to type annotations
